apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-shard-0-full
  namespace: pipeline
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: command-worker:v1
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: OUTPUT_KEY
              value: "teacher/shard-0.jsonl"
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434/api/generate"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
          envFrom:
            - secretRef:
                name: seaweedfs-s3-credentials
          volumeMounts:
            - name: teacher-prompt
              mountPath: /app/prompts
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: teacher-prompt
          configMap:
            name: teacher-prompt
---
