master:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi

volume:
  replicas: 1
  dataDirs:
    - name: data
      type: persistentVolumeClaim
      size: 5Gi
      maxVolumes: 0

filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 2Gi

s3:
  enabled: true
  replicas: 1
  enableAuth: true
  credentials:
    admin:
      existingSecret: seaweedfs-s3-credentials
      accessKeyKey: admin_access_key_id
      secretKeyKey: admin_secret_access_key
  createBuckets:
    - name: datasets
    - name: models
